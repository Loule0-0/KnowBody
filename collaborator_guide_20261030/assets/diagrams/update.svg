<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1170" viewBox="0 0 2200 1170"><rect width="100%" height="100%" fill="white"/><text x="55" y="81.16" font-family="Noto Sans CJK SC, sans-serif" font-size="48" font-weight="700" fill="#142b44">提炼不是追加摘要，而是比较同一问题的证据</text><rect x="55" y="145" width="595" height="290" rx="22" fill="#edf6ff" stroke="#2677cb" stroke-width="3"/><text x="83" y="207.8" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#2677cb">原始交互 E</text><text x="83" y="270.29" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400" fill="#142b44">before → receipt → post</text><text x="83" y="323.94" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400" fill="#142b44">成功 / 失败 / 中性片段</text><rect x="805" y="145" width="595" height="290" rx="22" fill="#eef6fc" stroke="#2677cb" stroke-width="3"/><text x="833" y="207.8" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#2677cb">条件案例 C</text><text x="833" y="270.29" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400" fill="#142b44">实际看过的精确来源</text><text x="833" y="323.94" font-family="Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400" fill="#142b44">条件、响应、未知与版本</text><rect x="1580" y="145" width="565" height="290" rx="22" fill="#f3edfa" stroke="#8655b4" stroke-width="3"/><text x="1608" y="207.8" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#8655b4">比较同族知识 K</text><text x="1608" y="269.12" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="400" fill="#142b44">支持 / 反例 / 相关</text><text x="1608" y="321.32" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="400" fill="#142b44">是否为同一个决策问题？</text><polyline points="650,285 805,285" stroke="#2677cb" stroke-width="6" fill="none" stroke-linejoin="round"/><polygon points="805,285 787.6513101340662,292.74744860813183 787.6513101340662,277.25255139186817" fill="#2677cb"/><polyline points="1400,285 1580,285" stroke="#8655b4" stroke-width="6" fill="none" stroke-linejoin="round"/><polygon points="1580,285 1562.651310134066,292.74744860813183 1562.651310134066,277.25255139186817" fill="#8655b4"/><rect x="55" y="585" width="480" height="215" rx="22" fill="#f3edfa" stroke="#8655b4" stroke-width="3"/><text x="83" y="647.8" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#8655b4">append_refs</text><text x="83" y="705.61" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="400" fill="#142b44">含义不变，加来源</text><polyline points="1860,435 1860,505 295,505 295,585" stroke="#8655b4" stroke-width="4" fill="none" stroke-linejoin="round"/><polygon points="295,585 287.25255139186817,567.6513101340662 302.74744860813183,567.6513101340662" fill="#8655b4"/><rect x="590" y="585" width="480" height="215" rx="22" fill="#f3edfa" stroke="#8655b4" stroke-width="3"/><text x="618" y="647.8" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#8655b4">revise</text><text x="618" y="705.61" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="400" fill="#142b44">改变条件或解释</text><polyline points="1860,435 1860,505 830,505 830,585" stroke="#8655b4" stroke-width="4" fill="none" stroke-linejoin="round"/><polygon points="830,585 822.2525513918681,567.6513101340662 837.7474486081318,567.6513101340662" fill="#8655b4"/><rect x="1125" y="585" width="480" height="215" rx="22" fill="#f3edfa" stroke="#8655b4" stroke-width="3"/><text x="1153" y="647.8" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#8655b4">add</text><text x="1153" y="705.61" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="400" fill="#142b44">新的可复用问题</text><polyline points="1860,435 1860,505 1365,505 1365,585" stroke="#8655b4" stroke-width="4" fill="none" stroke-linejoin="round"/><polygon points="1365,585 1357.252551391868,567.6513101340662 1372.747448608132,567.6513101340662" fill="#8655b4"/><rect x="1660" y="585" width="480" height="215" rx="22" fill="#f3edfa" stroke="#8655b4" stroke-width="3"/><text x="1688" y="647.8" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#8655b4">keep / defer</text><text x="1688" y="705.61" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="400" fill="#142b44">暂留案例并说明</text><polyline points="1860,435 1860,505 1900,505 1900,585" stroke="#8655b4" stroke-width="4" fill="none" stroke-linejoin="round"/><polygon points="1900,585 1892.252551391868,567.6513101340662 1907.747448608132,567.6513101340662" fill="#8655b4"/><rect x="55" y="930" width="2090" height="170" rx="22" fill="#edf8ef" stroke="#2f8651" stroke-width="3"/><text x="85" y="996.8" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" fill="#2f8651">宿主校验与独立原子组提交</text><text x="85" y="1052.12" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="400" fill="#142b44">来源版本、读权限、配置依赖、C/K链接与组依赖；失败只修复拒绝组。</text></svg>